<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Glow effects use gradients and layered strokes, not SVG filters, so Qt's SVG renderer draws them too. -->
  <defs>
    <radialGradient id="halo" cx="64" cy="64" r="64" gradientUnits="userSpaceOnUse">
      <stop offset=".76" stop-color="#1e6bff" stop-opacity=".95"/>
      <stop offset=".84" stop-color="#1e5cff" stop-opacity=".45"/>
      <stop offset=".93" stop-color="#1a4dff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#1a4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="64" cy="112" r="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22b4ff"/>
      <stop offset=".22" stop-color="#0d6fe6"/>
      <stop offset=".55" stop-color="#0638b8"/>
      <stop offset="1" stop-color="#04207a"/>
    </radialGradient>
    <radialGradient id="shade" cx="64" cy="56" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#021457" stop-opacity=".55"/>
      <stop offset="1" stop-color="#021457" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="14" x2="0" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f7dff"/>
      <stop offset="1" stop-color="#4fe0ff"/>
    </linearGradient>
    <linearGradient id="arc" x1="34" y1="0" x2="94" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fd2ff"/>
      <stop offset=".5" stop-color="#9df0ff"/>
      <stop offset="1" stop-color="#4fd2ff"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="50" x2="0" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#f1f6ff"/>
      <stop offset="1" stop-color="#cfdcf2"/>
    </linearGradient>
    <path id="padshape" d="M40 52 h48 c12 0 18 8 20 20 l4 18 c2 10 -8 16 -15 9 l-10 -11 h-46 l-10 11 c-7 7 -17 1 -15 -9 l4 -18 c2 -12 8 -20 20 -20 Z"/>
  </defs>

  <!-- outer glow -->
  <circle cx="64" cy="64" r="64" fill="url(#halo)"/>

  <!-- badge body -->
  <circle cx="64" cy="64" r="50" fill="url(#body)"/>
  <circle cx="64" cy="64" r="50" fill="url(#shade)"/>

  <!-- neon rim -->
  <circle cx="64" cy="64" r="51.5" fill="none" stroke="#3aa8ff" stroke-opacity=".35" stroke-width="5"/>
  <circle cx="64" cy="64" r="50" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="47.5" fill="none" stroke="#6fe3ff" stroke-opacity=".35" stroke-width="1.2"/>

  <!-- glowing arc -->
  <g fill="none" stroke-linecap="round">
    <path d="M34 44 Q64 26 94 44" stroke="#3ccaff" stroke-opacity=".12" stroke-width="18"/>
    <path d="M34 44 Q64 26 94 44" stroke="#3ccaff" stroke-opacity=".22" stroke-width="13"/>
    <path d="M34 44 Q64 26 94 44" stroke="url(#arc)" stroke-width="7"/>
    <path d="M36.5 42.4 Q64 26.4 91.5 42.4" stroke="#ffffff" stroke-opacity=".45" stroke-width="2"/>
  </g>

  <!-- gamepad -->
  <g transform="translate(64 70) scale(.74) translate(-64 -76)">
    <use href="#padshape" transform="translate(0 7)" fill="#010f45" fill-opacity=".22"/>
    <use href="#padshape" transform="translate(0 4)" fill="#010f45" fill-opacity=".35"/>
    <use href="#padshape" fill="url(#pad)"/>
    <rect x="35" y="66" width="20" height="7" rx="3.5" fill="#0a3a9e"/>
    <rect x="41.5" y="59.5" width="7" height="20" rx="3.5" fill="#0a3a9e"/>
    <circle cx="82" cy="64" r="6" fill="#0a3a9e"/>
    <circle cx="94" cy="73" r="5" fill="#0a3a9e"/>
  </g>
</svg>
