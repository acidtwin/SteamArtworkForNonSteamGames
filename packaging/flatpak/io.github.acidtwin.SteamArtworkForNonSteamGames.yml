# Flatpak manifest for Steam Artwork for Non-Steam Games.
#
# Build and install it locally from a checkout of the repo (needs flatpak-builder and Flathub):
#
#   flatpak-builder --user --install --force-clean --install-deps-from=flathub \
#       build-dir packaging/flatpak/io.github.acidtwin.SteamArtworkForNonSteamGames.yml
#   flatpak run io.github.acidtwin.SteamArtworkForNonSteamGames
#
# The app's own source is this checkout (type: dir). For a Flathub submission, swap it for
# the release tag:  type: git, url: https://github.com/acidtwin/SteamArtworkForNonSteamGames,
# tag: v1.0.0, commit: <the tag's commit>.

id: io.github.acidtwin.SteamArtworkForNonSteamGames
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: steam-artwork-finder

finish-args:
  - --share=network  # SteamGridDB and the Steam store
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Steam's own folders: shortcuts.vdf and the grid folder are written here (after a backup).
  - --filesystem=~/.steam
  - --filesystem=~/.local/share/Steam
  - --filesystem=~/.var/app/com.valvesoftware.Steam  # Steam installed from Flathub
  # Read-only, for the icon inside each game's .exe and for pictures the user picks; games
  # live anywhere (other drives, SD cards, Heroic and Lutris folders).
  - --filesystem=host:ro
  # flatpak-spawn --host: is Steam running, and closing and restarting it so it picks up
  # new artwork (see steam.py: steam_running, shutdown_steam, start_steam).
  - --talk-name=org.freedesktop.Flatpak

build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
    - BASEAPP_DISABLE_NUMPY=1

cleanup-commands:
  - /app/cleanup-BaseApp.sh
  # The BaseApp ships shiboken6's code generator, which pulls in about 150 MB of LLVM and
  # clang; the app only needs the shiboken6 runtime. PyOpenGL is unused too.
  - rm -rf /app/cleanup-BaseApp.sh /app/lib/libLLVM* /app/lib/libclang* /app/bin/shiboken6
    /app/bin/shiboken6-genpyi /app/lib/python3*/site-packages/shiboken6_generator*
    /app/lib/python3*/site-packages/OpenGL /app/lib/python3*/site-packages/pyopengl-*
    /app/lib/python3*/site-packages/pyproject_hooks* /app/lib/python3*/site-packages/patchelf-*
  # PySide's developer tools, type stubs and build-time files.
  - cd /app/lib/python3*/site-packages/PySide6 && rm -rf assistant balsam balsamui designer
    lrelease lupdate qmlformat qmllint qmlls qsb glue include typesystems *.pyi
  # Qt modules the app doesn't use (it needs QtCore, QtGui, QtWidgets, QtSvg and QtMultimedia).
  - cd /app/lib/python3*/site-packages/PySide6 && rm -f Qt3D*.so QtBluetooth.* QtCharts.*
    QtDesigner.* QtGraphs.* QtGraphsWidgets.* QtHelp.* QtHttpServer.* QtLocation.* QtNetworkAuth.*
    QtNfc.* QtOpenGL.* QtOpenGLWidgets.* QtPdf.* QtPdfWidgets.* QtPositioning.* QtQuick3D.*
    QtQuickControls2.* QtQuickTest.* QtRemoteObjects.* QtScxml.* QtSensors.* QtSerialPort.*
    QtSpatialAudio.* QtSql.* QtStateMachine.* QtTest.* QtTextToSpeech.* QtUiTools.* QtWebChannel.*
    QtWebSockets.*

modules:
  - name: python-deps
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} --no-build-isolation setuptools requests
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/a3/dc/17031897dae0efacfea57dfd3a82fdd2a2aeb58e0ff71b77b87e44edc772/setuptools-80.9.0-py3-none-any.whl
        sha256: 062d34222ad13e0cc312a4c02d73f059e86a4acbfbdea8f8f76b28c99f306922
      - type: file
        url: https://files.pythonhosted.org/packages/a0/f4/c67b0b3f1b9245e8d266f0f112c500d50e5b4e83cb6f3b71b6528104182a/requests-2.34.2-py3-none-any.whl
        sha256: 2a0d60c172f83ac6ab31e4554906c0f3b3588d37b5cb939b1c061f4907e278e0
      - type: file
        url: https://files.pythonhosted.org/packages/92/9d/c4e665119135114480843e7ab388fa94d8480650450e6f8e26b70d323a4c/urllib3-2.8.0-py3-none-any.whl
        sha256: 0cf3cae568d36aa9576b28dfb35f11328f1cb974ca7647d9475ebb86c75ac6e3
      - type: file
        url: https://files.pythonhosted.org/packages/58/a2/bb081bab032533a855d44de1d56f8e8426114ff1ba5d1f07a438a0a654f8/idna-3.20-py3-none-any.whl
        sha256: ab7ae7122974553370f0bdb919e1a960b2cd1bc1ef0276416d896db81c14582c
      - type: file
        url: https://files.pythonhosted.org/packages/32/d1/a3652fe2c19134d0d15922177821d863cbd7e842d53a21bbe7e8e3a1b5ac/certifi-2026.10.23-py3-none-any.whl
        sha256: e9b54de76e530bb6cf0ccd036787103acb58fd42ba930ea8bf948ddbaa2f61d1
      - type: file
        url: https://files.pythonhosted.org/packages/fc/ad/d07d7862a62ffa6d79d68074d14823243dd235a77c45262acbf6adeb28bf/charset_normalizer-3.5.2-py3-none-any.whl
        sha256: b6b751274acb69d77b3323d6b7dbaa3c7fdfc1eb829b7eb61d262f32e1af9685

  - name: steam-artwork-for-non-steam-games
    buildsystem: simple
    build-commands:
      # PySide6 comes from the BaseApp, so pip installs only the app itself.
      - pip3 install --verbose --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm644 packaging/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 packaging/${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 packaging/${FLATPAK_ID}.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .venv
          - build-dir
          - .flatpak-builder
