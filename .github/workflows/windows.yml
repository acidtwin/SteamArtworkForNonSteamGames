name: Windows build

# A portable Windows build: a zipped folder with SteamArtworkForNonSteamGames.exe in it.
# Every run keeps the zip as a workflow artifact; a v* tag also attaches it to that release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # attaching the zip to a release

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the app
        run: pip install -e ".[dev]" pytest-timeout

      # One run per file, so a test stuck on Windows (stopped by the timeout, with a stack
      # trace) doesn't hide the failures in the other files.
      - name: Run tests
        shell: pwsh
        run: |
          $failed = @()
          foreach ($f in Get-ChildItem tests\test_*.py) {
            pytest -q -rfE --tb=short --timeout=60 $f.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $f.Name }
          }
          if ($failed) { throw "Failed: $($failed -join ', ')" }

  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ZIP: SteamArtworkForNonSteamGames-Windows.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the app and PyInstaller
        run: pip install . pyinstaller

      - name: Build
        run: |
          python packaging/windows/make_icon.py build/app.ico
          pyinstaller --noconfirm packaging/windows/SteamArtworkForNonSteamGames.spec

      # The window has to open and stay open: a missing DLL or module ends it within seconds.
      - name: Check the app starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SteamArtworkForNonSteamGames\SteamArtworkForNonSteamGames.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "The app quit straight away (exit code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

      - name: Zip
        shell: pwsh
        run: |
          Copy-Item LICENSE dist\SteamArtworkForNonSteamGames\LICENSE.txt
          Compress-Archive -Path dist\SteamArtworkForNonSteamGames -DestinationPath $env:ZIP
          "{0:N1} MB" -f ((Get-Item $env:ZIP).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: SteamArtworkForNonSteamGames-Windows
          path: ${{ env.ZIP }}
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --notes "" }
          gh release upload $env:GITHUB_REF_NAME $env:ZIP --clobber
