[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-artwork-finder"
version = "1.0.0rc1"
description = "Find and apply SteamGridDB artwork and icons for your non-Steam games."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Acid Design" }]
dependencies = [
    # PySide6 6.12.0 crashes on Python before 3.12 ("deallocating None").
    "PySide6>=6.5,!=6.12.0; python_version < '3.12'",
    "PySide6>=6.5; python_version >= '3.12'",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.gui-scripts]
steam-artwork-finder = "steam_artwork_finder.gui.app:main"

[tool.setuptools.packages.find]
include = ["steam_artwork_finder*"]

[tool.setuptools.package-data]
"steam_artwork_finder.gui" = ["icons/*.svg", "icons/*.png", "fonts/*"]
